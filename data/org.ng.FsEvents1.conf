<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- only root may own the name -->
  <policy user="root">
    <allow own="org.ng.FsEvents1"/>
  </policy>
  <!-- everyone may ask: the service answers each caller about its own home only -->
  <policy context="default">
    <allow send_destination="org.ng.FsEvents1" send_interface="org.ng.FsEvents1"/>
    <allow send_destination="org.ng.FsEvents1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
